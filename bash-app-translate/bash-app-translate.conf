#!/bin/bash

## User configurations for bash-app-translate.


# BTR_PREFER_LANG determines the target language for the translation.
# Default: empty (which means bash-app-translate takes the value from the LANG environment variable).
# Note that the first 5 characters of the $LANG value is used,
# e.g. btr_${appname}_en_US or btr_${appname}_pt_BR.
#
# Example values: "en_US", "fi_FI" or "pt_BR".
#
BTR_PREFER_LANG=""


# BTR_WARN_ABOUT_MISSING_TRANSLATION enables or disables the messages about a missing language translation.
# Supported values: "yes" or "no"
# Default: "yes"
#
BTR_WARN_ABOUT_MISSING_TRANSLATION="yes"

